<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>CopyPasteTool</title>
  <style>
    :root {
      --bg: #1a1a1e;
      --surface: #232328;
      --surface-hover: #2b2b31;
      --border: #333338;
      --border-light: #3d3d43;
      --text: #eceef0;
      --text-dim: #9a9aa2;
      --accent: #5a9bd4;
      --danger: #d46a6a;
      --success: #4fae74;
      --radius: 8px;
      --radius-sm: 6px;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
    }
    .app {
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
    }
    textarea {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.4;
      resize: none;
      overflow: hidden;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    textarea::placeholder {
      color: var(--text-dim);
    }
    .new-entry {
      border-color: var(--border-light);
      font-size: 13px;
    }
    .new-entry:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-hover);
    }
    #clips {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .clip {
      display: flex;
      align-items: stretch;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px;
      transition: border-color 0.15s ease;
    }
    .clip:hover {
      border-color: var(--border-light);
    }
    .clip textarea {
      flex: 1;
      background: transparent;
      border: none;
      padding: 4px 6px;
      cursor: default;
    }
    .clip-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .clip-actions button {
      background: transparent;
      color: var(--text-dim);
      border: none;
      border-radius: var(--radius-sm);
      width: 30px;
      flex: 1;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .clip-actions button:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .clip-actions .delete:hover {
      background: rgba(212, 106, 106, 0.15);
      color: var(--danger);
    }
    .clip-actions .copy.copied {
      background: rgba(79, 174, 116, 0.18);
      color: var(--success);
    }
    .clip img {
      flex: 1;
      max-width: 100%;
      border-radius: var(--radius-sm);
      display: block;
    }
    .empty-hint {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      padding: 10px 4px 4px;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <textarea id="new-entry" class="new-entry" rows="1" placeholder="Text hier einfügen…"></textarea>
    <div id="clips"></div>
  </div>

  <script>
    const STORAGE_KEY = 'copypaste-tool-clips';
    const newEntry = document.getElementById('new-entry');
    const clipsContainer = document.getElementById('clips');

    function loadClips() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        // Ältere Versionen speicherten reine Text-Strings statt {type, data}.
        return parsed.map((clip) =>
          typeof clip === 'string' ? { type: 'text', data: clip } : clip
        );
      } catch (err) {
        return [];
      }
    }

    function saveClips(clips) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clips));
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    const app = document.getElementById('app');

    function syncWindowSize() {
      requestAnimationFrame(() => {
        if (window.electronAPI) {
          window.electronAPI.resizeWindow(app.scrollHeight);
        }
      });
    }

    let clips = loadClips();

    function renderClips() {
      clipsContainer.innerHTML = '';

      if (clips.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = 'Noch keine Einträge – mit Strg+V einfügen';
        clipsContainer.appendChild(hint);
        syncWindowSize();
        return;
      }

      clips.forEach((clip, index) => {
        const row = document.createElement('div');
        row.className = 'clip';

        let contentEl;
        if (clip.type === 'image') {
          contentEl = document.createElement('img');
          contentEl.src = clip.data;
        } else {
          contentEl = document.createElement('textarea');
          contentEl.value = clip.data;
          contentEl.readOnly = true;
          contentEl.rows = 1;
        }

        const actions = document.createElement('div');
        actions.className = 'clip-actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy';
        copyBtn.title = 'Kopieren';
        copyBtn.textContent = '📋';
        copyBtn.addEventListener('click', () => {
          window.electronAPI.writeClipboard(clip).then(() => {
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 600);
          });
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete';
        deleteBtn.title = 'Löschen';
        deleteBtn.textContent = '🗑';
        deleteBtn.addEventListener('click', () => {
          clips.splice(index, 1);
          saveClips(clips);
          renderClips();
        });

        actions.appendChild(copyBtn);
        actions.appendChild(deleteBtn);
        row.appendChild(contentEl);
        row.appendChild(actions);
        clipsContainer.appendChild(row);

        if (clip.type === 'image') {
          contentEl.addEventListener('load', syncWindowSize);
        } else {
          requestAnimationFrame(() => autoResize(contentEl));
        }
      });

      syncWindowSize();
    }

    function addClip(clip) {
      if (!clip) return;
      if (clip.type === 'text' && !clip.data.trim()) return;
      if (clip.type === 'image' && !clip.data) return;
      clips.unshift(clip);
      saveClips(clips);
      renderClips();
    }

    newEntry.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (newEntry.value.trim()) {
          addClip({ type: 'text', data: newEntry.value });
          newEntry.value = '';
          autoResize(newEntry);
          syncWindowSize();
        }
      }
    });

    newEntry.addEventListener('input', () => {
      autoResize(newEntry);
      syncWindowSize();
    });

    document.addEventListener('keydown', (event) => {
      const isPasteShortcut = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'v';
      if (!isPasteShortcut) return;

      event.preventDefault();
      window.electronAPI.readClipboard().then((clip) => {
        addClip(clip);
        if (event.target === newEntry) {
          newEntry.value = '';
          autoResize(newEntry);
        }
      }).catch((err) => {
        console.error('Zwischenablage konnte nicht gelesen werden:', err);
      });
    });

    renderClips();
    autoResize(newEntry);
    syncWindowSize();
    newEntry.focus();
  </script>
</body>
</html>
