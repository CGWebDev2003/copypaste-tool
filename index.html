<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>CopyPasteTool</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      background: #1e1e1e;
      color: #f0f0f0;
    }
    .app {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 8px;
      gap: 8px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: #2a2a2a;
      color: #f0f0f0;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: none;
      overflow: hidden;
    }
    .new-entry {
      border-color: #4a4a4a;
    }
    .new-entry:focus {
      outline: none;
      border-color: #5a9bd4;
    }
    .clip {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }
    .clip textarea {
      flex: 1;
    }
    .clip-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .clip-actions button {
      background: #3a3a3a;
      color: #f0f0f0;
      border: none;
      border-radius: 4px;
      width: 32px;
      flex: 1;
      cursor: pointer;
      font-size: 14px;
    }
    .clip-actions button:hover {
      background: #4a4a4a;
    }
    .clip-actions .delete:hover {
      background: #7a3a3a;
    }
    .clip-actions .copy.copied {
      background: #3a7a4a;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <textarea id="new-entry" class="new-entry" rows="1" placeholder="Text hier einfügen…"></textarea>
    <div id="clips"></div>
  </div>

  <script>
    const STORAGE_KEY = 'copypaste-tool-clips';
    const newEntry = document.getElementById('new-entry');
    const clipsContainer = document.getElementById('clips');

    function loadClips() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (err) {
        return [];
      }
    }

    function saveClips(clips) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clips));
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    const app = document.getElementById('app');

    function syncWindowSize() {
      requestAnimationFrame(() => {
        if (window.electronAPI) {
          window.electronAPI.resizeWindow(app.scrollHeight);
        }
      });
    }

    let clips = loadClips();

    function renderClips() {
      clipsContainer.innerHTML = '';
      clips.forEach((text, index) => {
        const row = document.createElement('div');
        row.className = 'clip';

        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.readOnly = true;
        textarea.rows = 1;

        const actions = document.createElement('div');
        actions.className = 'clip-actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy';
        copyBtn.title = 'Kopieren';
        copyBtn.textContent = '📋';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(text).then(() => {
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 600);
          });
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete';
        deleteBtn.title = 'Löschen';
        deleteBtn.textContent = '🗑';
        deleteBtn.addEventListener('click', () => {
          clips.splice(index, 1);
          saveClips(clips);
          renderClips();
        });

        actions.appendChild(copyBtn);
        actions.appendChild(deleteBtn);
        row.appendChild(textarea);
        row.appendChild(actions);
        clipsContainer.appendChild(row);

        requestAnimationFrame(() => autoResize(textarea));
      });

      syncWindowSize();
    }

    function addClip(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      clips.unshift(trimmed);
      saveClips(clips);
      renderClips();
    }

    newEntry.addEventListener('paste', () => {
      setTimeout(() => {
        if (newEntry.value.trim()) {
          addClip(newEntry.value);
          newEntry.value = '';
          autoResize(newEntry);
          syncWindowSize();
        }
      }, 0);
    });

    newEntry.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (newEntry.value.trim()) {
          addClip(newEntry.value);
          newEntry.value = '';
          autoResize(newEntry);
          syncWindowSize();
        }
      }
    });

    newEntry.addEventListener('input', () => {
      autoResize(newEntry);
      syncWindowSize();
    });

    renderClips();
    autoResize(newEntry);
    syncWindowSize();
    newEntry.focus();
  </script>
</body>
</html>
