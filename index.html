<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>CopyPasteTool</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      background: #1e1e1e;
      color: #f0f0f0;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      box-sizing: border-box;
      padding: 16px;
      text-align: center;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 13px;
      color: #b0b0b0;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CopyPasteTool</h1>
    <p>Fenster ist immer im Vordergrund.</p>
  </div>
</body>
</html>
